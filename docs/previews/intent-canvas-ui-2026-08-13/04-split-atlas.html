<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>04 · 对分地图 Split Atlas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Outfit:wght@450;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f5f1;
      --ink: #171614;
      --muted: #6e6a62;
      --line: #ddd6c8;
      --blue: #2563eb;
      --panel: #fffcf7;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { font-family: Outfit, "Noto Sans SC", sans-serif; background: var(--bg); color: var(--ink); }
    .app { height: 100%; display: grid; grid-template-columns: 320px 1fr; }
    aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; }
    .head { padding: 18px 16px 10px; }
    .head small { letter-spacing: .14em; text-transform: uppercase; font-size: 10px; color: var(--blue); }
    h1 { margin: 4px 0 10px; font-size: 22px; letter-spacing: -.04em; }
    input {
      width: 100%; height: 34px; border: 1px solid var(--line); background: #fff;
      padding: 0 10px; font: 13px/1 "Noto Sans SC", sans-serif;
    }
    .list { overflow: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .item {
      height: auto; min-height: 0; width: 100%;
      border: 1px solid transparent; padding: 10px 11px; cursor: pointer; background: transparent;
      text-align: left; font: inherit; color: inherit;
      display: block;
    }
    .item:hover { background: #f1ece3; }
    .item.active { background: #eceaf8; border-color: #c7c3ea; }
    .item .mode { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--blue); }
    .item b { display: block; margin: 3px 0 2px; font-size: 14px; }
    .item p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .foot { margin-top: auto; padding: 12px; display: flex; gap: 8px; border-top: 1px solid var(--line); }
    button { height: 34px; border: 1px solid var(--line); background: #fff; padding: 0 10px; font: 600 12px Outfit, "Noto Sans SC", sans-serif; cursor: pointer; }
    button.primary { background: var(--blue); color: #fff; border-color: var(--blue); flex: 1; }
    .atlas {
      position: relative; min-width: 0;
      background:
        linear-gradient(#e8e2d5 1px, transparent 1px) 0 0 / 28px 28px,
        linear-gradient(90deg, #e8e2d5 1px, transparent 1px) 0 0 / 28px 28px,
        #f3efe6;
    }
    .atlas svg { width: 100%; height: 100%; }
    .hud {
      position: absolute; left: 18px; right: 18px; bottom: 18px;
      display: flex; justify-content: space-between; align-items: end;
      pointer-events: none;
    }
    .hud h2 { margin: 0 0 4px; font-size: 28px; letter-spacing: -.04em; }
    .hud p { margin: 0; color: var(--muted); font-size: 13px; }
    .chips { display: flex; gap: 8px; }
    .chips span { background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; font-size: 12px; pointer-events: auto; }
    .back { position: fixed; left: 16px; bottom: 14px; font-size: 11px; color: var(--muted); text-decoration: none; }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="head">
        <small>04 · Split Atlas · <a href="index.html" style="color:inherit">返回方向墙</a></small>
        <h1>意图画布</h1>
        <input placeholder="搜索标题、摘要或文件路径" />
      </div>
      <div class="list">
        <button class="item active">
          <div class="mode">Architect</div>
          <b>文件关系图 · OspOrder</b>
          <p>80 条直接文件关系 · 166 元素</p>
        </button>
        <button class="item">
          <div class="mode">Spotlight</div>
          <b>支付回调失败路径</b>
          <p>3 层 callee · 超时 / 幂等</p>
        </button>
        <button class="item">
          <div class="mode">File</div>
          <b>订单聚合根边界</b>
          <p>9 个文件 · 写入边界</p>
        </button>
        <button class="item">
          <div class="mode">Architect</div>
          <b>库存扣减时序</b>
          <p>锁库存 → 支付 → 回滚</p>
        </button>
      </div>
      <div class="foot">
        <button>地图</button>
        <button class="primary">新建</button>
      </div>
    </aside>
    <section class="atlas">
      <svg viewBox="0 0 980 720" aria-hidden="true">
        <g fill="none" stroke="#2563eb" stroke-width="1.7">
          <path d="M250 360H420M420 360H600M420 360V210H600M420 360V510H600M600 210H780M600 360H820M600 510H780"/>
        </g>
        <rect x="120" y="318" width="130" height="84" rx="6" fill="#2563eb"/>
        <rect x="372" y="326" width="130" height="68" rx="6" fill="#fffcf7" stroke="#171614"/>
        <rect x="568" y="176" width="150" height="64" rx="6" fill="#fffcf7" stroke="#0f766e"/>
        <rect x="568" y="328" width="150" height="64" rx="6" fill="#fffcf7" stroke="#b45309"/>
        <rect x="568" y="478" width="150" height="64" rx="6" fill="#fffcf7" stroke="#171614"/>
        <rect x="760" y="186" width="150" height="44" rx="5" fill="#ece7dc" stroke="#6e6a62"/>
        <rect x="800" y="338" width="150" height="44" rx="5" fill="#ece7dc" stroke="#6e6a62"/>
        <rect x="760" y="488" width="150" height="44" rx="5" fill="#ece7dc" stroke="#6e6a62"/>
        <text x="136" y="366" fill="#fff" font-size="14">OspOrderWeb</text>
        <text x="136" y="386" fill="#dbeafe" font-size="11">Controller.java</text>
      </svg>
      <div class="hud">
        <div>
          <h2>文件关系图 · OspOrder</h2>
          <p>以 OspOrderWebController.java 为中心 · 双击节点进入编辑</p>
        </div>
        <div class="chips">
          <span>166 元素</span>
          <span>40 文件</span>
          <span>40 节点</span>
          <span>打开</span>
        </div>
      </div>
    </section>
  </div>
  <script>
    document.querySelectorAll(".item").forEach((item) => {
      item.addEventListener("click", () => {
        document.querySelectorAll(".item").forEach((el) => el.classList.remove("active"));
        item.classList.add("active");
        const title = item.querySelector("b").textContent;
        document.querySelector(".hud h2").textContent = title;
      });
    });
  </script>
</body>
</html>
