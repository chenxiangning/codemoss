<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>06 · 全量日志控制台</title><link rel="stylesheet" href="shell.css">
<style>
.deck{display:flex;flex-direction:column;padding:0;background:#0a0a0c}
.logbar{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.logbar .rndsw{padding:0;margin:0;gap:0;border:1px solid var(--border2);border-radius:7px;overflow:hidden;background:#09090b}
.logbar .rndsw span{border:0;border-radius:0;padding:3px 12px;background:transparent}
.logbar .rndsw span.on{background:var(--txt);color:#18181b}
.tsep{display:none;width:1px;height:16px;background:var(--border2);margin:0 4px}
body[data-state="2"] .tsep, body[data-state="3"] .tsep, body[data-state="4"] .tsep{display:block}
.logbar .f{border:1px solid var(--border2);border-radius:6px;padding:2px 10px;font:11px var(--mono);color:var(--muted);cursor:pointer;background:var(--card)}
.logbar .f:hover{color:var(--txt)}
.logbar .f.on{background:var(--txt);border-color:var(--txt);color:#18181b;font-weight:600}
.deck[data-round="1"] .f.rd2{display:none}
.deck[data-round="2"] .f.rd1{display:none}
.log{flex:1;min-height:0;overflow-y:auto;padding:10px 0;font:11.5px/1.7 var(--mono)}
.log .row{display:flex}
.log .ln{flex:none;width:44px;text-align:right;padding-right:12px;color:#3f3f46;user-select:none}
.log .tx{color:#b6bdc9;white-space:pre-wrap;word-break:break-word}
.log .hd .tx{color:var(--blue);font-weight:700}
.log .ok .tx{color:var(--green)}
.log.hide-g1 [data-grp="g1"],.log.hide-g2 [data-grp="g2"],.log.hide-g3 [data-grp="g3"],.log.hide-g4 [data-grp="g4"]{display:none}
.banner{margin:14px;border:1px dashed var(--border2);border-radius:10px;padding:14px;color:var(--muted);font-size:12px}
.banner b{color:var(--violet)}
</style></head><body data-state="1">
<div class="app">
  <div class="canvas" id="canvas"></div>
  <div class="deck" data-round="1">
    <div class="s1 banner">当前模板：<b>默认三步</b>（左侧 composer 点「⚡ 协作」可切换自定义模板）。<br>发送后，此处按时间顺序滚动输出<b>全部环节</b>的原始日志，顶部可按环节过滤。</div>
    <div class="s234" style="display:contents">
    <div class="logbar">
      <div class="rndsw"><span data-r="1" onclick="setRound(1)">第一轮 ✓</span><span data-r="2" onclick="setRound(2)">第二轮 ●</span></div>
      <span class="tsep"></span>
      <span class="f on" onclick="filt('all',this)">全部</span>
      <span class="f" onclick="filt('g1',this)">规划</span>
      <span class="f" onclick="filt('g2',this)">实现</span>
      <span class="f rd1" onclick="filt('g3',this)">审查</span>
      <span class="f rd2" onclick="filt('g3',this)">测试加固</span>
      <span class="f rd2" onclick="filt('g4',this)">审查</span>
    </div>
    <div class="log" id="log"><div class="r1" id="log1"></div><div class="r2" id="log2"></div></div>
    </div>
  </div>
</div>
<script src="shell.js"></script>
<script>
function filt(k,el){document.querySelectorAll('.f').forEach(x=>x.classList.remove('on'));el.classList.add('on');
  const log=document.getElementById('log');log.className='log';
  if(k!=='all')log.classList.add('hide-'+k);}
document.addEventListener('round',()=>{const all=document.querySelector('.f');if(all)filt('all',all);});
let n=0;
function push(root,cls,grp,text){text.split('\n').forEach(line=>{
  const r=document.createElement('div');r.className='row '+cls;r.dataset.grp=grp;
  const ln=document.createElement('span');ln.className='ln';ln.textContent=++n;
  const tx=document.createElement('span');tx.className='tx';tx.textContent=line;
  r.appendChild(ln);r.appendChild(tx);root.appendChild(r);});}
window.addEventListener('load',()=>{
  const l1=document.getElementById('log1');
  push(l1,'hd','g1','══ 第一轮 · 规划 · claude-sonnet-4.6 ══');
  push(l1,'','g1',STREAMS.plan);
  push(l1,'hd','g2','══ 第一轮 · 实现 · gpt-5.3-codex ══');
  push(l1,'','g2',STREAMS.impl);
  push(l1,'hd','g3','══ 第一轮 · 审查 · grok-4 ══');
  push(l1,'','g3',STREAMS.review);
  push(l1,'ok','g3','══ ROUND 1 DONE · 汇总已写入主对话 ══');
  const l2=document.getElementById('log2');
  push(l2,'hd','g1','══ 第二轮 · 规划 · claude（模板：修复流水线） ══');
  push(l2,'','g1',STREAMS2.plan2);
  push(l2,'hd','g2','══ 第二轮 · 实现 · codex ══');
  push(l2,'','g2',STREAMS2.impl2);
  push(l2,'hd','g3','══ 第二轮 · 测试加固 · claude ══');
  push(l2,'','g3',STREAMS2.test2);
  push(l2,'hd','g4','══ 第二轮 · 审查 · grok ══');
  push(l2,'','g4',STREAMS2.review2);
  push(l2,'ok','g4','══ ROUND 2 DONE ══');
});
</script></body></html>
