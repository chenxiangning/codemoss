<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>mossx × pi 特有能力 UI 化原型</title>
<!--
  设计假设（Junior pass 说明）：
  - 视觉体系 100% 复刻 mossx 现有 token：zinc 暗色 surface ramp（oklch）、#005fb8 用户气泡、
    #7a9dcc text-accent、#78ebbe/#ffaf55/#ff6e6e 状态色、SF Pro Text + SF Mono、radius 10px
  - 内容场景是真实的：一个「pi adapter 接入」工作会话，贴合 mossx 当前工程上下文
  - 5 个 demo 特性全部可交互，不是静态截图：
    1. Session Tree（git-graph 风格，点击跳分支 / 用户消息可 fork）—— pi 独有
    2. 双通道消息队列（插话 steering / 排队 follow-up）—— pi 独有，steering 标注需 RPC mode
    3. /compact 上下文压缩（footer 用量条 + 自定义指令弹窗 + 压缩后 marker）
    4. Slash palette（输入 / 唤起 skills + prompt templates）
    5. Thinking level 切换（model:thinking 语法实时联动）
  - 顶部「特性导览」chip 点击后对应区域高亮脉冲，方便逐一讲解
-->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --surface-sidebar: oklch(0.165 0.004 286);
    --surface-topbar: oklch(0.16 0.004 286);
    --surface-right-panel: oklch(0.155 0.004 286);
    --surface-composer: oklch(0.16 0.004 286);
    --surface-messages: oklch(0.141 0.005 285.823);
    --surface-card: oklch(0.21 0.006 285.885);
    --surface-card-strong: oklch(0.3 0.006 286);
    --surface-card-muted: oklch(0.235 0.006 286);
    --surface-item: oklch(0.195 0.006 286);
    --surface-control: oklch(0.274 0.006 286.033);
    --surface-control-hover: oklch(0.32 0.006 286);
    --surface-hover: oklch(0.215 0.006 286);
    --surface-popover: oklch(0.18 0.005 286);
    --surface-bubble-user: #005fb8;
    --border-subtle: oklch(0.245 0.005 286);
    --border-muted: oklch(0.225 0.005 286);
    --border-strong: oklch(0.32 0.006 286);
    --text-primary: #e6e7ea;
    --text-strong: #ffffff;
    --text-muted: #b3b3b3;
    --text-subtle: #999999;
    --text-faint: #808080;
    --text-dim: #595959;
    --text-accent: #7a9dcc;
    --border-accent: #4a8caa;
    --status-success: #78ebbe;
    --status-warning: #ffaf55;
    --status-error: #ff6e6e;
    --info: #7a9dcc;
    --radius: 10px;
    --ui-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    --code-font: "SF Mono", "SFMono-Regular", Menlo, Monaco, "Sarasa Mono SC", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--ui-font);
    background: #0a0b0e;
    color: var(--text-primary);
    display: flex; align-items: center; justify-content: center;
    padding: 28px;
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(0,95,184,.4); }

  /* ===== 窗口外壳 ===== */
  .window {
    width: 1240px; max-width: 100%; height: 800px;
    border-radius: 12px;
    border: 1px solid var(--border-strong);
    background: var(--surface-messages);
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.03);
  }
  .titlebar {
    height: 40px; flex: none;
    background: var(--surface-topbar);
    border-bottom: 1px solid var(--border-subtle);
    display: flex; align-items: center; gap: 12px;
    padding: 0 14px 0 84px; position: relative;
  }
  .traffic { position: absolute; left: 16px; display: flex; gap: 8px; }
  .traffic i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .traffic i:nth-child(1){ background:#ff5f57; } .traffic i:nth-child(2){ background:#febc2e; } .traffic i:nth-child(3){ background:#28c840; }
  .titlebar .doc-title { font-size: 12.5px; color: var(--text-muted); }
  .titlebar .doc-title b { color: var(--text-primary); font-weight: 600; }

  /* 特性导览 chips */
  .guide { display: flex; gap: 6px; margin-left: auto; }
  .guide-chip {
    font-size: 11px; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--border-strong);
    background: var(--surface-control); color: var(--text-muted);
    cursor: pointer; transition: all .15s; user-select: none;
    display: flex; align-items: center; gap: 5px;
  }
  .guide-chip:hover { background: var(--surface-control-hover); color: var(--text-primary); }
  .guide-chip.on { border-color: var(--border-accent); color: var(--text-accent); background: rgba(74,140,170,.12); }
  .guide-chip .num {
    width: 15px; height: 15px; border-radius: 50%; font-size: 10px;
    background: var(--surface-card-strong); color: var(--text-subtle);
    display: inline-flex; align-items: center; justify-content: center;
  }
  .guide-chip.on .num { background: var(--border-accent); color: #fff; }

  .body { flex: 1; display: flex; min-height: 0; }

  /* ===== 侧边栏 ===== */
  .sidebar {
    width: 216px; flex: none; background: var(--surface-sidebar);
    border-right: 1px solid var(--border-subtle);
    display: flex; flex-direction: column;
  }
  .ws-name { padding: 14px 14px 10px; font-size: 12px; color: var(--text-subtle); display: flex; align-items: center; gap: 7px; }
  .ws-name .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--status-success); }
  .ws-name b { color: var(--text-primary); font-size: 13px; }
  .side-label { padding: 8px 14px 5px; font-size: 10.5px; letter-spacing: .06em; color: var(--text-dim); text-transform: uppercase; }
  .sess-item {
    margin: 1px 8px; padding: 8px 10px; border-radius: 8px; cursor: default;
    display: flex; flex-direction: column; gap: 3px;
  }
  .sess-item.active { background: var(--surface-item); box-shadow: inset 0 0 0 1px var(--border-subtle); }
  .sess-item .t { font-size: 12.5px; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess-item:not(.active) .t { color: var(--text-muted); }
  .sess-item .m { font-size: 10.5px; color: var(--text-dim); display: flex; gap: 6px; align-items: center; }
  .eng-badge {
    font-size: 9.5px; font-family: var(--code-font); padding: 1px 5px; border-radius: 4px;
    background: rgba(122,157,204,.14); color: var(--text-accent); border: 1px solid rgba(122,157,204,.25);
  }
  .eng-badge.other { background: var(--surface-control); color: var(--text-faint); border-color: var(--border-subtle); }
  .branch-count { color: var(--status-warning); }

  /* ===== 消息区 ===== */
  .main { flex: 1; display: flex; min-width: 0; }
  .chat-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-head {
    height: 42px; flex: none; display: flex; align-items: center; gap: 10px;
    padding: 0 16px; border-bottom: 1px solid var(--border-subtle);
  }
  .chat-head .path { font-size: 11.5px; font-family: var(--code-font); color: var(--text-faint); }
  .chat-head .spacer { flex: 1; }
  .tree-toggle {
    font-size: 11.5px; padding: 5px 11px; border-radius: 7px; cursor: pointer; user-select: none;
    border: 1px solid var(--border-strong); background: var(--surface-control); color: var(--text-muted);
    display: flex; align-items: center; gap: 6px; transition: all .15s;
  }
  .tree-toggle:hover { color: var(--text-primary); background: var(--surface-control-hover); }
  .tree-toggle.on { border-color: var(--border-accent); color: var(--text-accent); background: rgba(74,140,170,.12); }

  .messages { flex: 1; overflow-y: auto; padding: 18px 20px 12px; }
  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: oklch(0.38 0.006 286); border-radius: 99px; }

  .msg { margin-bottom: 16px; display: flex; flex-direction: column; gap: 6px; max-width: 640px; }
  .msg .who { font-size: 10.5px; color: var(--text-dim); display: flex; gap: 8px; align-items: center; }
  .msg.user { align-items: flex-end; margin-left: auto; }
  .msg.user .bubble {
    background: var(--surface-bubble-user); color: #fff;
    border-radius: 12px 12px 4px 12px; padding: 9px 13px; font-size: 13px; line-height: 1.5;
  }
  .msg.asst .bubble {
    background: var(--surface-card); border: 1px solid var(--border-subtle);
    border-radius: 4px 12px 12px 12px; padding: 10px 14px; font-size: 13px; line-height: 1.6;
    color: var(--text-primary);
  }
  .msg .bubble code { font-family: var(--code-font); font-size: 11.5px; background: rgba(255,255,255,.07); padding: 1px 5px; border-radius: 4px; }
  .tool-chip {
    display: inline-flex; align-items: center; gap: 7px; margin-top: 2px;
    font-family: var(--code-font); font-size: 11px; color: var(--text-subtle);
    background: var(--surface-card-muted); border: 1px solid var(--border-muted);
    padding: 4px 9px; border-radius: 6px;
  }
  .tool-chip .ok { color: var(--status-success); }

  /* compaction marker */
  .compact-marker {
    display: flex; align-items: center; gap: 10px; margin: 18px 0;
    color: var(--text-faint); font-size: 11px;
  }
  .compact-marker::before, .compact-marker::after { content: ""; flex: 1; height: 1px; background: var(--border-subtle); }
  .compact-marker .pill {
    display: flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 999px;
    border: 1px dashed var(--border-accent); color: var(--text-accent);
    background: rgba(74,140,170,.07);
  }

  /* ===== Composer ===== */
  .composer {
    flex: none; margin: 0 14px 12px; border-radius: var(--radius);
    background: var(--surface-composer); border: 1px solid var(--border-strong);
    display: flex; flex-direction: column; position: relative;
    z-index: 10; /* 浮层（发送菜单/palette）需要压过上方 messages 区域 */
  }
  .queue-chips { display: flex; flex-direction: column; gap: 5px; padding: 10px 12px 0; }
  .q-chip {
    display: flex; align-items: center; gap: 8px; font-size: 12px;
    padding: 6px 10px; border-radius: 7px; border: 1px solid var(--border-subtle);
    background: var(--surface-card-muted); color: var(--text-muted);
    animation: slideIn .18s ease-out;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .q-chip .mode { font-size: 10px; padding: 1px 6px; border-radius: 4px; flex: none; }
  .q-chip .mode.steer { background: rgba(255,175,85,.15); color: var(--status-warning); border: 1px solid rgba(255,175,85,.3); }
  .q-chip .mode.follow { background: var(--surface-control); color: var(--text-subtle); border: 1px solid var(--border-subtle); }
  .q-chip .txt { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q-chip .x { cursor: pointer; color: var(--text-dim); flex: none; }
  .q-chip .x:hover { color: var(--status-error); }

  .input-row { display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px; }
  .input-wrap { flex: 1; position: relative; }
  textarea {
    width: 100%; resize: none; border: none; outline: none; background: transparent;
    color: var(--text-primary); font-family: var(--ui-font); font-size: 13.5px; line-height: 1.5;
    max-height: 110px;
  }
  textarea::placeholder { color: var(--text-dim); }

  .composer-bar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; border-top: 1px solid var(--border-muted);
  }
  .model-tag { font-family: var(--code-font); font-size: 11px; color: var(--text-subtle); display: flex; gap: 5px; align-items: center; }
  .model-tag .tk { color: var(--status-warning); }

  /* thinking 切换 */
  .think-seg { display: flex; border: 1px solid var(--border-subtle); border-radius: 7px; overflow: hidden; }
  .think-seg button {
    font-size: 10.5px; font-family: var(--code-font); padding: 4px 8px; border: none; cursor: pointer;
    background: transparent; color: var(--text-dim); transition: all .12s;
  }
  .think-seg button:hover { color: var(--text-muted); background: var(--surface-hover); }
  .think-seg button.on { background: rgba(255,175,85,.16); color: var(--status-warning); }

  /* 发送 split button */
  .send-group { display: flex; margin-left: auto; border-radius: 8px; overflow: hidden; border: 1px solid var(--border-accent); }
  .send-group .main-send {
    border: none; padding: 6px 14px; font-size: 12.5px; cursor: pointer;
    background: rgba(74,140,170,.2); color: #cfe3ee; display: flex; align-items: center; gap: 6px;
  }
  .send-group .main-send:hover { background: rgba(74,140,170,.32); }
  .send-group .arrow {
    border: none; border-left: 1px solid var(--border-accent); padding: 6px 8px; cursor: pointer;
    background: rgba(74,140,170,.13); color: #cfe3ee; font-size: 9px;
  }
  .send-menu {
    position: absolute; right: 12px; bottom: calc(100% + 8px); width: 300px;
    background: var(--surface-popover); border: 1px solid var(--border-strong); border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5); padding: 5px; z-index: 30;
  }
  .send-menu .opt { padding: 9px 11px; border-radius: 7px; cursor: pointer; }
  .send-menu .opt:hover { background: var(--surface-hover); }
  .send-menu .opt.sel { background: rgba(74,140,170,.1); }
  .send-menu .opt .k { font-size: 12.5px; color: var(--text-primary); display: flex; justify-content: space-between; align-items: center; }
  .send-menu .opt .k .kbd { font-family: var(--code-font); font-size: 10px; color: var(--text-faint); border: 1px solid var(--border-subtle); border-radius: 4px; padding: 1px 5px; }
  .send-menu .opt .d { font-size: 11px; color: var(--text-faint); margin-top: 3px; line-height: 1.45; }
  .send-menu .rpc-note {
    margin: 5px 6px 3px; padding: 7px 9px; border-radius: 6px; font-size: 10.5px; line-height: 1.5;
    background: rgba(255,175,85,.08); border: 1px solid rgba(255,175,85,.25); color: var(--status-warning);
  }

  /* slash palette */
  .palette {
    position: absolute; left: 12px; right: 12px; bottom: calc(100% + 8px);
    background: var(--surface-popover); border: 1px solid var(--border-strong); border-radius: 10px;
    box-shadow: 0 12px 40px rgba(0,0,0,.5); max-height: 260px; overflow: hidden; z-index: 30;
    display: flex; flex-direction: column;
  }
  .palette .sec { padding: 7px 12px 3px; font-size: 10px; letter-spacing: .06em; color: var(--text-dim); text-transform: uppercase; }
  .palette .item { display: flex; align-items: center; gap: 9px; padding: 7px 12px; cursor: pointer; }
  .palette .item:hover, .palette .item.sel { background: var(--surface-hover); }
  .palette .item .cmd { font-family: var(--code-font); font-size: 12px; color: var(--text-accent); min-width: 168px; }
  .palette .item .desc { font-size: 11.5px; color: var(--text-faint); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .palette .item .src { font-size: 9.5px; font-family: var(--code-font); color: var(--text-dim); border: 1px solid var(--border-subtle); padding: 1px 5px; border-radius: 4px; flex: none; }

  /* ===== Tree 面板 ===== */
  .tree-panel {
    width: 340px; flex: none; background: var(--surface-right-panel);
    border-left: 1px solid var(--border-subtle);
    display: flex; flex-direction: column;
  }
  .tree-head { padding: 13px 14px 9px; border-bottom: 1px solid var(--border-subtle); }
  .tree-head .t { font-size: 13px; font-weight: 600; color: var(--text-strong); display: flex; align-items: center; gap: 8px; }
  .tree-head .sub { font-size: 10.5px; color: var(--text-faint); margin-top: 4px; font-family: var(--code-font); }
  .tree-filter { display: flex; gap: 5px; padding: 9px 14px; border-bottom: 1px solid var(--border-muted); }
  .tree-filter button {
    font-size: 10.5px; padding: 3px 9px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--border-subtle); background: transparent; color: var(--text-faint);
  }
  .tree-filter button.on { border-color: var(--border-accent); color: var(--text-accent); background: rgba(74,140,170,.1); }
  .tree-scroll { flex: 1; overflow-y: auto; position: relative; padding: 10px 0; }
  .tree-scroll::-webkit-scrollbar { width: 8px; }
  .tree-scroll::-webkit-scrollbar-thumb { background: oklch(0.38 0.006 286); border-radius: 99px; }
  .tree-rows { position: relative; }
  .trow {
    position: relative; height: 36px; display: flex; align-items: center;
    cursor: pointer; padding-right: 8px;
  }
  .trow:hover { background: var(--surface-hover); }
  .trow .txt {
    font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
    color: var(--text-muted);
  }
  .trow.onpath .txt { color: var(--text-primary); }
  .trow.offpath { opacity: .38; }
  .trow.current { background: rgba(74,140,170,.12); box-shadow: inset 2px 0 0 var(--border-accent); }
  .trow .bm { color: var(--status-warning); font-size: 10px; flex: none; margin-left: 4px; }
  .trow .fork-btn {
    flex: none; font-size: 10px; padding: 2px 8px; border-radius: 5px; cursor: pointer;
    border: 1px solid var(--border-accent); color: var(--text-accent); background: rgba(74,140,170,.1);
    opacity: 0; transition: opacity .12s; margin-left: 6px;
  }
  .trow:hover .fork-btn { opacity: 1; }
  .trow .fork-btn:hover { background: rgba(74,140,170,.25); }
  .tree-svg { position: absolute; left: 0; top: 0; pointer-events: none; }
  .tree-foot {
    padding: 9px 14px; border-top: 1px solid var(--border-subtle);
    font-size: 10.5px; color: var(--text-dim); line-height: 1.6;
  }
  .tree-foot kbd {
    font-family: var(--code-font); font-size: 9.5px; border: 1px solid var(--border-subtle);
    border-radius: 4px; padding: 0 4px; color: var(--text-subtle); background: var(--surface-control);
  }

  /* ===== Footer ===== */
  .footer {
    height: 30px; flex: none; border-top: 1px solid var(--border-subtle);
    background: var(--surface-topbar);
    display: flex; align-items: center; gap: 14px; padding: 0 14px;
    font-size: 10.5px; font-family: var(--code-font); color: var(--text-faint);
  }
  .ctx-meter { display: flex; align-items: center; gap: 7px; margin-left: auto; cursor: pointer; padding: 3px 7px; border-radius: 6px; }
  .ctx-meter:hover { background: var(--surface-hover); }
  .ctx-track { width: 90px; height: 5px; border-radius: 99px; background: var(--surface-control); overflow: hidden; }
  .ctx-fill { height: 100%; border-radius: 99px; transition: width .5s ease; }
  .ctx-label { font-size: 10.5px; }
  .ctx-meter.warn .ctx-fill { background: var(--status-warning); }
  .ctx-meter.ok .ctx-fill { background: var(--status-success); }
  .ctx-meter.warn .ctx-label { color: var(--status-warning); }
  .ctx-meter.ok .ctx-label { color: var(--status-success); }

  /* ===== Compact 弹窗 ===== */
  .modal-mask {
    position: absolute; inset: 0; background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center; z-index: 50;
    animation: fadeIn .15s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    width: 460px; background: var(--surface-popover); border: 1px solid var(--border-strong);
    border-radius: 12px; box-shadow: 0 24px 70px rgba(0,0,0,.6); overflow: hidden;
    animation: popIn .18s ease-out;
  }
  @keyframes popIn { from { opacity: 0; transform: scale(.97) translateY(6px); } to { opacity: 1; transform: none; } }
  .modal .m-head { padding: 15px 18px 11px; border-bottom: 1px solid var(--border-muted); }
  .modal .m-head .t { font-size: 14px; font-weight: 600; color: var(--text-strong); }
  .modal .m-head .d { font-size: 11.5px; color: var(--text-faint); margin-top: 5px; line-height: 1.55; }
  .modal .m-body { padding: 14px 18px; }
  .modal .stat-row { display: flex; gap: 10px; margin-bottom: 12px; }
  .modal .stat {
    flex: 1; background: var(--surface-card-muted); border: 1px solid var(--border-muted);
    border-radius: 8px; padding: 9px 11px;
  }
  .modal .stat .v { font-family: var(--code-font); font-size: 15px; color: var(--text-primary); }
  .modal .stat .v.warn { color: var(--status-warning); } .modal .stat .v.ok { color: var(--status-success); }
  .modal .stat .k { font-size: 10px; color: var(--text-dim); margin-top: 3px; }
  .modal label { font-size: 11px; color: var(--text-subtle); display: block; margin-bottom: 6px; }
  .modal textarea {
    background: var(--surface-card-muted); border: 1px solid var(--border-subtle); border-radius: 8px;

  let cur = byId[id];
  while (cur) { path.unshift(cur); cur = byId[cur.parent]; }
  return path;
}

/* ================= Tree 视图（git-graph 风格） ================= */
function TreeView({ nodes, activeId, onPathIds, filter, onJump, onFork }) {
  const ROW_H = 36, LANE_W = 20, PAD_L = 14, NODE_R = 4.5;
  const visible = nodes.filter(n =>
    filter === "all" ? true : filter === "user" ? n.role === "user" : n.bm
  );
  const laneX = l => PAD_L + l * LANE_W + NODE_R + 2;
  // 每行 y 中心
  const yOf = (id) => nodes.findIndex(n => n.id === id) * ROW_H + ROW_H / 2;
  const maxLane = Math.max(...nodes.map(n => n.lane));
  const svgW = laneX(maxLane) + NODE_R + 4;
  const svgH = nodes.length * ROW_H;

  const edges = nodes.filter(n => n.parent).map(n => {
    const p = nodes.find(x => x.id === n.parent);
    return { from: { x: laneX(p.lane), y: yOf(p.id) }, to: { x: laneX(n.lane), y: yOf(n.id) }, sameLane: p.lane === n.lane, onPath: onPathIds.has(n.id) && onPathIds.has(p.id) };
  });

  return (
    <div className="tree-scroll">
      <div className="tree-rows" style={{ height: svgH }}>
        <svg className="tree-svg" width={svgW} height={svgH}>
          {edges.map((e, i) => (
            <path key={i}
              d={e.sameLane
                ? `M ${e.from.x} ${e.from.y} L ${e.to.x} ${e.to.y}`
                : `M ${e.from.x} ${e.from.y} L ${e.from.x} ${e.to.y - ROW_H/2 + 6} Q ${e.from.x} ${e.to.y - 8}, ${e.to.x} ${e.to.y - 8} L ${e.to.x} ${e.to.y}`}
              fill="none"
              stroke={e.onPath ? "var(--border-accent)" : "var(--border-subtle)"}
              strokeWidth={e.onPath ? 1.8 : 1.2}
            />
          ))}
        </svg>
        {nodes.map(n => {
          const hidden = !visible.includes(n);
          const onPath = onPathIds.has(n.id);
          const isCurrent = n.id === activeId;
          return (
            <div key={n.id}
              className={"trow" + (onPath ? " onpath" : " offpath") + (isCurrent ? " current" : "")}
              style={{ display: hidden ? "none" : "flex" }}
              onClick={() => onJump(n.id)}>
              <svg width={svgW} height={ROW_H} style={{flex: "none"}}>
                <circle cx={laneX(n.lane)} cy={ROW_H/2} r={isCurrent ? 6 : NODE_R}
                  fill={isCurrent ? "var(--border-accent)" : n.role === "user" ? (onPath ? "var(--text-accent)" : "var(--surface-control-hover)") : (onPath ? "var(--surface-card-strong)" : "var(--surface-control)")}
                  stroke={isCurrent ? "#fff" : onPath ? "var(--border-accent)" : "var(--border-strong)"}
                  strokeWidth={isCurrent ? 1.5 : 1}
                />
                {n.role === "user" && (
                  <circle cx={laneX(n.lane)} cy={ROW_H/2} r={isCurrent ? 2 : 1.6} fill="#fff" opacity={onPath ? .9 : .3}/>
                )}
              </svg>
              <span className="txt">{n.text}</span>
              {n.bm && <span className="bm">🔖</span>}
              {n.role === "user" && (
                <button className="fork-btn" onClick={e => { e.stopPropagation(); onFork(n); }}>⑂ 分叉</button>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
