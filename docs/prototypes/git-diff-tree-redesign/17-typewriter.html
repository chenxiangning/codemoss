<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>17 · 打字机粗粝</title>
<link rel="stylesheet" href="base.css">
<style>
/* 17 · 打字机粗粝 —— 无图标纯文本树：[U] 方括号字母 + 大号等宽 +
   目录用斜杠结尾，像 git status 的精装印刷版 */
.ic { display: none; }
.tw { width: 14px; }
.row { min-height: 30px; gap: 7px; }
.st {
  width: auto; font-size: 11.5px; font-weight: 700;
}
.st::before { content: "["; color: #c4c9cf; }
.st::after { content: "]"; color: #c4c9cf; }
.row.dir .nm::after { content: "/"; color: #9aa1a9; }
.nm { font-size: 13px; }
.row.file { padding-left: calc(12px + var(--d, 0) * 17px + 14px); }
.row:hover { background: none; }
.row.file:hover .nm { background: #f1f3f5; border-radius: 3px; }
</style>
</head>
<body><div id="app"></div><script src="shared.js"></script></body>
</html>
