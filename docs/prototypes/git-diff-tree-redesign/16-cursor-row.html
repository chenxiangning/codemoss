<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>16 · 键盘光标行</title>
<link rel="stylesheet" href="base.css">
<style>
/* 16 · 键盘光标行 —— VSCode Quick Open 风：一条「光标行」主导视觉，
   底部常驻快捷键提示条；为纯键盘流设计（演示静态光标在第 17 行） */
.row { border-radius: 5px; margin: 0 6px; padding-right: 8px; }
.row:nth-child(17) {
  background: #e8f0fe;
  box-shadow: inset 0 0 0 1.5px #2563eb;
}
.row:nth-child(17) .nm { color: #1d4ed8; }
.row:nth-child(17) .acts { display: inline-flex; }
.hint { font-family: ui-monospace, monospace; }
.hint kbd {
  background: #f1f3f5; border: 1px solid #dfe3e8; border-bottom-width: 2px;
  border-radius: 4px; padding: 0 5px; font-size: 10.5px; color: #3f4750;
}
</style>
<script>
/* 把 hint 换成键盘图例 */
window.addEventListener('DOMContentLoaded', function () {
  document.querySelector('.hint').innerHTML =
    '<kbd>↑</kbd> <kbd>↓</kbd> 导航 &nbsp;<kbd>space</kbd> 勾选 &nbsp;<kbd>⏎</kbd> diff &nbsp;<kbd>s</kbd> stage &nbsp;<kbd>u</kbd> 还原';
});
</script>
</head>
<body><div id="app"></div><script src="shared.js"></script></body>
</html>
