<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>19 · 快捷键提示列</title>
<link rel="stylesheet" href="base.css">
<style>
/* 19 · 快捷键提示列 —— 每行右缘一个 kbd 键帽（1-9,a-k），
   按下即勾选；把「选文件提交」变成打地鼠式极速操作 */
.row.file::after {
  content: ""; position: absolute; right: 38px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; border-radius: 4px;
  background: #f1f3f5; border: 1px solid #dfe3e8; border-bottom-width: 2px;
}
.row { counter-increment: kh; }
.tree { counter-reset: kh; }
.row.file .fstats { display: none; }
/* 键帽字符 */
.row.file .dot {
  display: inline-flex; position: absolute; right: 38px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; align-items: center; justify-content: center;
  font-size: 9.5px; font-weight: 700; color: #6b7280; z-index: 1;
  font-family: ui-monospace, monospace;
}
.row.file:nth-of-type(1) .dot { content: "1"; }
</style>
<script>
/* 用 JS 给键帽填字符（CSS counter 内容塞进 .dot 不可行时的务实做法） */
window.addEventListener('DOMContentLoaded', function () {
  var keys = '123456789abcdefghijk'.split('');
  document.querySelectorAll('.row.file').forEach(function (el, i) {
    if (keys[i]) el.querySelector('.dot').textContent = keys[i];
  });
});
</script>
</head>
<body><div id="app"></div><script src="shared.js"></script></body>
</html>
