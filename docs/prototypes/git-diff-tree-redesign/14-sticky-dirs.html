<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>14 · 粘性目录带</title>
<link rel="stylesheet" href="base.css">
<style>
/* 14 · 粘性目录带 —— 目录行变成 iOS 通讯录式粘性分节带：
   滚动时当前路径始终钉在顶部，长列表不迷路 */
.row.dir {
  position: sticky; top: 0; z-index: 3;
  background: rgba(246,247,249,.92); backdrop-filter: blur(6px);
  border-bottom: 1px solid #eceff2;
  min-height: 30px;
}
.row.dir[style*="--d:1"] { top: 0; }
.row.dir[style*="--d:2"] { top: 30px; background: rgba(240,242,245,.92); }
.row.dir[style*="--d:3"] { top: 60px; background: rgba(234,237,241,.92); }
.row.dir .nm { font-size: 11.5px; letter-spacing: .02em; }
.row.dir::before { opacity: .5; }
</style>
</head>
<body><div id="app"></div><script src="shared.js"></script></body>
</html>
