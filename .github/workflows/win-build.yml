name: Build Windows Package

on:
  push:
    branches:
      - codex/2026-03-20-local
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (branch, tag, or SHA)"
        required: false
        default: "main"
        type: string

jobs:
  build_windows:
    name: windows (x64)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Windows doctor checks
        run: npm run doctor:win

      - name: Build unsigned Windows NSIS installer
        shell: pwsh
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          # Keep Windows CI artifacts unsigned by using tauri.windows.conf.json
          # (updater disabled, createUpdaterArtifacts=false, no code-signing config)
          # MSI bundling is temporarily disabled in CI because wix light.exe fails on hosted runners.
          npm run tauri -- build --config src-tauri/tauri.windows.conf.json --bundles nsis

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
