name: CI

on:
  workflow_dispatch:

jobs:
  memory-kind-contract:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-kind-contract-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-kind-contract-
      - name: Install CMake
        run: command -v cmake >/dev/null 2>&1 || brew install cmake
      - name: Install dependencies
        run: npm ci
      - name: Memory kind contract tests (Rust + TS)
        run: npm run test:memory-kind-contract

  test-tauri:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - name: Install CMake
        run: command -v cmake >/dev/null 2>&1 || brew install cmake
      - name: Rust tests
        run: cargo test
        working-directory: src-tauri
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm run test
  build-macos:
    runs-on: macos-latest
    needs:
      - lint
      - typecheck
      - test-js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
      - name: Install CMake
        run: command -v cmake >/dev/null 2>&1 || brew install cmake
      - name: Install dependencies
        run: npm ci
      - name: Tauri debug build
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: npm run tauri -- build --debug --no-bundle

  build-windows:
    runs-on: windows-latest
    environment: release
    env:
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY_B64: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            src-tauri\target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-
      - name: Install dependencies
        run: npm ci
      - name: Build Windows package
        shell: pwsh
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          $tauriConfig = "src-tauri/tauri.windows.conf.json"

          if ($env:TAURI_SIGNING_PRIVATE_KEY_B64) {
            # TAURI_SIGNING_PRIVATE_KEY expects base64-encoded minisign key
            $env:TAURI_SIGNING_PRIVATE_KEY = $env:TAURI_SIGNING_PRIVATE_KEY_B64
          } else {
            Write-Host "TAURI_SIGNING_PRIVATE_KEY_B64 is empty, disable updater artifacts for CI package build."
            $disableUpdaterScript = @"
const fs = require('node:fs');
const inputPath = 'src-tauri/tauri.windows.conf.json';
const outputPath = 'src-tauri/tauri.windows.ci.conf.json';
const config = JSON.parse(fs.readFileSync(inputPath, 'utf8'));
config.bundle = { ...(config.bundle ?? {}), createUpdaterArtifacts: false };
fs.writeFileSync(outputPath, JSON.stringify(config, null, 2));
"@
            node -e $disableUpdaterScript
            $tauriConfig = "src-tauri/tauri.windows.ci.conf.json"
          }
          npm run tauri -- build --config $tauriConfig --bundles nsis
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-package
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
