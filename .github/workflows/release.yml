name: Release

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build"
        required: false
        default: "feature/v0.6.1-win"
        type: string

permissions:
  contents: read

jobs:
  build_windows_unsigned:
    name: windows unsigned (x64)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          cache-bin: false
          shared-key: v1-win-x64-rust
          cache-on-failure: true

      - name: Configure sccache environment
        shell: pwsh
        run: |
          "RUSTC_WRAPPER=sccache" >> $env:GITHUB_ENV
          "SCCACHE_GHA_ENABLED=true" >> $env:GITHUB_ENV
          "SCCACHE_DIR=$env:LOCALAPPDATA\sccache" >> $env:GITHUB_ENV

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install dependencies
        run: npm ci

      - name: Windows doctor checks
        run: npm run doctor:win

      - name: Write unsigned Windows config
        id: unsigned_config
        shell: pwsh
        run: |
          $configPath = Join-Path $env:RUNNER_TEMP "tauri.windows.unsigned.conf.json"
          $config = Get-Content "src-tauri/tauri.windows.conf.json" | ConvertFrom-Json -Depth 100

          if (-not $config.PSObject.Properties["bundle"]) {
            $config | Add-Member -MemberType NoteProperty -Name "bundle" -Value ([pscustomobject]@{})
          }

          if ($config.bundle.PSObject.Properties["createUpdaterArtifacts"]) {
            $config.bundle.createUpdaterArtifacts = $false
          } else {
            $config.bundle | Add-Member -MemberType NoteProperty -Name "createUpdaterArtifacts" -Value $false
          }

          $config | ConvertTo-Json -Depth 100 | Set-Content -Path $configPath -Encoding utf8
          "path=$configPath" >> $env:GITHUB_OUTPUT

      - name: Build unsigned Windows NSIS installer
        shell: pwsh
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          npm run tauri -- build --config "${{ steps.unsigned_config.outputs.path }}" --bundles nsis

      - name: Upload unsigned Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-unsigned-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
